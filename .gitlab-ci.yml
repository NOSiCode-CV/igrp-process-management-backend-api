image: docker:28.2.2
services:
  - name: docker:28.2.2-dind
    command: [ "--tls=false", "--mtu=1240" ]
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  REGISTRY_URL: "registry.nosi.cv"
  IMAGE_NAME: "igrp-process-management-backend-api"
  CI_PROJECT: "igrp"
  VERSION_TAG: "$CI_COMMIT_SHORT_SHA"
  IMAGE_NAME_FULL: "$REGISTRY_URL/$CI_PROJECT/$IMAGE_NAME"
  IMAGE_TAG: pre-release
  GIT_DEPTH: "1"                           # checkout raso (não precisamos de histórico)

stages:
  - build
  - manifest

# Builder buildx (driver docker-container: necessário p/ cache registry mode=max).
.build-template:

  only:
    - pre-release
  before_script:
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
    - docker buildx create --name igrpbuilder --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use igrpbuilder

build-jvm-arm64:
  stage: build
  extends: .build-template
  tags:
    - arm64
  script:
    # Cache de camadas por arch no registry (mode=max cacheia também a fase de build
    # Maven → a camada de dependency:go-offline é reutilizada entre pipelines).
    # ignore-error: se o registry não suportar o formato, o build continua sem exportar cache.
    - >
      docker buildx build -f Dockerfile --platform linux/arm64 --provenance=false
      --cache-from "type=registry,ref=$IMAGE_NAME_FULL-jvm:cache-arm64"
      --cache-to "type=registry,ref=$IMAGE_NAME_FULL-jvm:cache-arm64,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
      -t "$IMAGE_NAME_FULL-jvm:arm64-pre-release" --push .

build-jvm-amd64:
  stage: build
  extends: .build-template
  script:
    - >
      docker buildx build -f Dockerfile --platform linux/amd64 --provenance=false
      --cache-from "type=registry,ref=$IMAGE_NAME_FULL-jvm:cache-amd64"
      --cache-to "type=registry,ref=$IMAGE_NAME_FULL-jvm:cache-amd64,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
      -t "$IMAGE_NAME_FULL-jvm:amd64-pre-release" --push .

create-jvm-manifest:
  stage: manifest
  before_script:
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    # imagetools create combina os manifestos de arch num índice multi-arch e faz push
    # numa só operação. Robusto (lida com índices/attestations) — substitui o
    # 'docker manifest create --amend', que rejeita fontes que sejam manifest lists.
    - >
      docker buildx imagetools create
      -t "$IMAGE_NAME_FULL-jvm:$IMAGE_TAG"
      "$IMAGE_NAME_FULL-jvm:amd64-pre-release"
      "$IMAGE_NAME_FULL-jvm:arm64-pre-release"
  needs:
    - build-jvm-amd64
    - build-jvm-arm64
  only:
    - pre-release


build-pre-release-jvm-amd64:
  image: docker:28.2.2
  services:
    - name: docker:28.2.2-dind
      command: [ "--tls=false", "--mtu=1240" ]
  stage: build
  before_script:
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
    - docker buildx create --name igrpbuilder --driver docker-container --use --bootstrap 2>/dev/null || docker buildx use igrpbuilder
  script:
    - >
      docker buildx build -f Dockerfile --platform linux/amd64 --provenance=false
      --cache-from "type=registry,ref=$IMAGE_NAME_FULL-jvm:cache-amd64"
      --cache-to "type=registry,ref=$IMAGE_NAME_FULL-jvm:cache-amd64,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
      -t "$IMAGE_NAME_FULL-jvm:pre-release" --push .
  only:
    - deploy/pre-release
