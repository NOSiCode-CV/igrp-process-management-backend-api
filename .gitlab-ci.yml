image: docker:28.2.2
services:
  - name: docker:28.2.2-dind
    command: [ "--tls=false", "--mtu=1240" ]
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  REGISTRY_URL: "registry.nosi.cv"
  IMAGE_NAME: "igrp-process-management-backend-api"
  CI_PROJECT: "igrp"
  VERSION_TAG: "$CI_COMMIT_SHORT_SHA"
  IMAGE_NAME_FULL: "$REGISTRY_URL/$CI_PROJECT/$IMAGE_NAME"

stages:
  - build
  - manifest

# =============================================
#  Release pipelines (NOSi Registry - JVM multi-arch)
#
#  Branch  deploy/pre-release  -> tag  pre-release
#  Branch  deploy/0.1.0-beta   -> tag  0.1.0-beta
#  Branch  deploy/0.2.0-beta   -> tags 0.2.0-beta + latest
#
#  No pipeline runs on the mainline branch.
# =============================================

.release-rules: &release-rules
  - if: '$CI_COMMIT_BRANCH == "deploy/pre-release"'
  - if: '$CI_COMMIT_BRANCH == "deploy/0.1.0-beta"'
  - if: '$CI_COMMIT_BRANCH == "deploy/0.2.0-beta"'

build-jvm-arm64:
  stage: build
  tags:
    - arm64
  rules: *release-rules
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    - docker buildx create --use --name amd64builder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile --platform linux/arm64 -t "$IMAGE_NAME_FULL-jvm:arm64-$CI_COMMIT_REF_SLUG" --pull --push .

build-jvm-amd64:
  stage: build
  tags:
    - nosi-runner
  rules: *release-rules
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    - docker buildx create --use --name amd64builder || true
    - docker buildx inspect --bootstrap
    - docker build -f Dockerfile --platform linux/amd64 -t "$IMAGE_NAME_FULL-jvm:amd64-$CI_COMMIT_REF_SLUG" --pull --push .

create-jvm-manifest:
  stage: manifest
  tags:
    - nosi-runner
  needs:
    - build-jvm-amd64
    - build-jvm-arm64
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/pre-release"'
      variables:
        RELEASE_TAG: "pre-release"
    - if: '$CI_COMMIT_BRANCH == "deploy/0.1.0-beta"'
      variables:
        RELEASE_TAG: "0.1.0-beta"
    - if: '$CI_COMMIT_BRANCH == "deploy/0.2.0-beta"'
      variables:
        RELEASE_TAG: "0.2.0-beta"
  before_script:
    - docker login -u "$BASE_REGISTRY_USERNAME" -p "$BASE_REGISTRY_PASSWORD" "$REGISTRY_URL"
  script:
    - docker manifest create "$IMAGE_NAME_FULL-jvm:$RELEASE_TAG" --amend "$IMAGE_NAME_FULL-jvm:arm64-$CI_COMMIT_REF_SLUG" --amend "$IMAGE_NAME_FULL-jvm:amd64-$CI_COMMIT_REF_SLUG"
    - docker manifest push "$IMAGE_NAME_FULL-jvm:$RELEASE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "deploy/0.2.0-beta" ]; then
        docker manifest create "$IMAGE_NAME_FULL-jvm:latest" --amend "$IMAGE_NAME_FULL-jvm:arm64-$CI_COMMIT_REF_SLUG" --amend "$IMAGE_NAME_FULL-jvm:amd64-$CI_COMMIT_REF_SLUG"
        docker manifest push "$IMAGE_NAME_FULL-jvm:latest"
      fi
