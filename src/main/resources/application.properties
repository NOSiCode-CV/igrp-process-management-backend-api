# General
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false

spring.application.name=igrp-platform-process-management

# Default profile
spring.profiles.active=${SPRING_ACTIVE_PROFILE:development}

server.shutdown=graceful
management.endpoint.health.probes.enabled=true

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

igrp.mail.default.from=${IGRP_MAIL_DEFAULT_FROM:no-reply@igrp.cv}

spring.activiti.history-level=full
spring.activiti.db-history-used=true

# Security to iGRP Access Management
igrp.access.api.base-url=${IGRP_ACCESS_API_BASE_URL}

spring.kafka.bootstrap-servers=${MESSAGE_BROKER_PROVIDER:none}
spring.kafka.consumer.group-id=igrp-process

message.broker.provider=${MESSAGE_BROKER_PROVIDER:none}
spring.kafka.security.protocol=SSL
spring.kafka.ssl.trust-store-location=${KAFKA_SSL_TRUSTSTORE_LOCATION}
spring.kafka.ssl.trust-store-password=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
spring.kafka.ssl.key-store-location=${KAFKA_SSL_KEYSTORE_LOCATION}
spring.kafka.ssl.key-store-password=${KAFKA_SSL_KEYSTORE_PASSWORD}

spring:
  kafka:
    security:
      protocol: "SSL"
    bootstrap-servers: localhost:9093
    ssl:
      trust-store-location: classpath:/client-certs/kafka.client.truststore.jks
      trust-store-password: <password>
      key-store-location:  classpath:/client-certs/kafka.client.keystore.jks
      key-store-password: <password>