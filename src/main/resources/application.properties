# General
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false

spring.application.name=igrp-platform-process-management

# Default profile
spring.profiles.active=${SPRING_ACTIVE_PROFILE:development}

server.shutdown=graceful
management.endpoint.health.probes.enabled=true

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

igrp.mail.default.from=${IGRP_MAIL_DEFAULT_FROM:no-reply@igrp.cv}

spring.activiti.history-level=full
spring.activiti.db-history-used=true

# Security to iGRP Access Management
igrp.access.api.base-url=${IGRP_ACCESS_API_BASE_URL}


spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:my-group}


# Kafka SSL Config
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL}
spring.kafka.ssl.truststore.location=${KAFKA_TRUSTSTORE_LOCATION}
spring.kafka.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD}
spring.kafka.ssl.truststore.type=${KAFKA_TRUSTSTORE_TYPE}
spring.kafka.ssl.keystore.location=${KAFKA_KEYSTORE_LOCATION}
spring.kafka.ssl.keystore.password=${KAFKA_KEYSTORE_PASSWORD}
spring.kafka.ssl.keystore.type=${KAFKA_KEYSTORE_TYPE}
spring.kafka.ssl.key.password=${KAFKA_KEY_PASSWORD}
spring.kafka.ssl.endpoint.identification.algorithm=${KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM}